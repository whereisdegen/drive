[package]
name = "reward_vault"
version = "0.1.0"
description = "The daily prize for the five fastest drivers"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "reward_vault"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]

[dependencies]
anchor-lang = { version = "1.2.0", features = ["init-if-needed"] }
anchor-spl = "1.2.0"
solana-instructions-sysvar = "3.0.0"
solana-sdk-ids = "3.1.0"
